{% extends "base.html" %}

{% block content %}

<div class="container mt-4">

    <h2>
        {% if member %}
            Edit Anggota
        {% else %}
            Tambah Anggota
        {% endif %}
    </h2>

    {% if messages %}
        {% for message in messages %}
            <div class="alert alert-danger">
                {{ message }}
            </div>
        {% endfor %}
    {% endif %}

    <form method="POST">

        {% csrf_token %}

        <div class="mb-3">

            <label class="form-label">
                Kode Anggota
            </label>

            <input
                type="text"
                name="member_code"
                class="form-control"
                value="{{ member.member_code|default:'' }}"
                required
            >

        </div>

        <div class="mb-3">

            <label class="form-label">
                Nama Anggota
            </label>

            <input
                type="text"
                name="name"
                class="form-control"
                value="{{ member.name|default:'' }}"
                required
            >

        </div>

        <div class="mb-3">

            <label class="form-label">
                Telepon
            </label>

            <input
                type="text"
                name="phone"
                class="form-control"
                value="{{ member.phone|default:'' }}"
            >

        </div>

        <div class="mb-3">

            <label class="form-label">
                Email
            </label>

            <input
                type="email"
                name="email"
                class="form-control"
                value="{{ member.email|default:'' }}"
            >

        </div>

        <div class="mb-3">

            <label class="form-label">
                Alamat
            </label>

            <textarea
                name="address"
                class="form-control"
                rows="3"
            >{{ member.address|default:'' }}</textarea>

        </div>

        <button
            type="submit"
            class="btn btn-primary"
        >
            Simpan
        </button>

        <a
            href="{% url 'master_data:member_list' %}"
            class="btn btn-secondary"
        >
            Kembali
        </a>

    </form>

</div>

{% endblock %}
