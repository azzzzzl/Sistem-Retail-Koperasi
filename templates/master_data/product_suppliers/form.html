{% extends "base.html" %}

{% block content %}

<div class="container mt-4">

    <h2>
        {% if product_supplier %}
            Edit Produk Supplier
        {% else %}
            Tambah Produk Supplier
        {% endif %}
    </h2>

    {% if messages %}
        {% for message in messages %}
            <div class="alert alert-danger">
                {{ message }}
            </div>
        {% endfor %}
    {% endif %}

    <form method="POST">

        {% csrf_token %}

        <div class="mb-3">
            <label class="form-label">Produk</label>

            <select
                name="product_id"
                class="form-select"
                required
            >
                <option value="">-- Pilih Produk --</option>

                {% for product in products %}
                    <option
                        value="{{ product.id }}"
                        {% if product_supplier.product_id == product.id %}selected{% endif %}
                    >
                        {{ product.sku }} - {{ product.name }}
                    </option>
                {% endfor %}

            </select>
        </div>

        <div class="mb-3">
            <label class="form-label">Supplier</label>

            <select
                name="supplier_id"
                class="form-select"
                required
            >
                <option value="">-- Pilih Supplier --</option>

                {% for supplier in suppliers %}
                    <option
                        value="{{ supplier.id }}"
                        {% if product_supplier.supplier_id == supplier.id %}selected{% endif %}
                    >
                        {{ supplier.code }} - {{ supplier.name }}
                    </option>
                {% endfor %}

            </select>
        </div>

        <div class="mb-3">
            <label class="form-label">
                Kode Produk Supplier
            </label>

            <input
                type="text"
                name="supplier_product_code"
                class="form-control"
                value="{{ product_supplier.supplier_product_code|default:'' }}"
            >
        </div>

        <div class="mb-3">
            <label class="form-label">
                Harga Beli
            </label>

            <input
                type="number"
                name="purchase_price"
                class="form-control"
                min="0"
                step="0.01"
                value="{{ product_supplier.purchase_price|default:'0' }}"
                required
            >
        </div>

        <button
            type="submit"
            class="btn btn-primary"
        >
            Simpan
        </button>

        <a
            href="{% url 'master_data:product_supplier_list' %}"
            class="btn btn-secondary"
        >
            Kembali
        </a>

    </form>

</div>

{% endblock %}
