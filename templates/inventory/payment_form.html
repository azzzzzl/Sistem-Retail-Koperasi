{% extends "base.html" %}{% block title %}Pembayaran Supplier{% endblock %}{% block content %}<h1>Catat Pembayaran Supplier</h1>{% include "components/messages.html" %}<form method="post" class="card form-stack">{% csrf_token %}<label>Invoice<select name="invoice_id" required><option value="">Pilih invoice</option>{% for i in invoices %}<option value="{{ i|mongo_id }}">{{ i.invoiceNumber }} · Sisa Rp {{ i.remainingAmount }}</option>{% endfor %}</select></label><label>Nomor Pembayaran<input name="payment_number" required></label><div class="grid grid-2"><label>Jumlah<input name="amount" type="number" min="0.01" step="0.01" required></label><label>Tanggal<input name="payment_date" type="date"></label></div><label>Metode<select name="payment_method"><option>TRANSFER</option><option>CASH</option><option>GIRO</option><option>OTHER</option></select></label><label>Referensi<input name="reference_number"></label><label>Catatan<textarea name="notes"></textarea></label><button class="btn primary">Simpan Pembayaran</button></form>{% endblock %}
