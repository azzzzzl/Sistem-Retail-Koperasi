{% extends "base.html" %}{% block title %}Buat Stock Adjustment{% endblock %}{% block content %}<h1>Buat Stock Adjustment</h1>{% include "components/messages.html" %}<form method="post" class="card form-stack">{% csrf_token %}<label>Nomor<input name="adjustment_number" required></label><label>Produk<select name="product_id" required><option value="">Pilih produk</option>{% for p in products %}<option value="{{ p.id }}">{{ p.sku }} - {{ p.name }} (stok {{ p.stock }})</option>{% endfor %}</select></label><label>Tipe<select name="adjustment_type"><option>INCREASE</option><option>DECREASE</option></select></label><label>Quantity<input type="number" name="quantity" min="1" required></label><label>Alasan<input name="reason" required></label><label>Catatan<textarea name="notes"></textarea></label><button class="btn primary">Simpan</button></form>{% endblock %}
