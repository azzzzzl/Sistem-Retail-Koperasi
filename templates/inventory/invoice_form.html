{% extends "base.html" %}{% block title %}Buat Invoice Supplier{% endblock %}{% block content %}<h1>Buat Invoice Supplier</h1>{% include "components/messages.html" %}<form method="post" class="card form-stack">{% csrf_token %}<label>Pembelian<select name="purchase_id" required><option value="">Pilih pembelian</option>{% for p in purchases %}<option value="{{ p|mongo_id }}">{{ p.purchaseNumber }} · Rp {{ p.total }}</option>{% endfor %}</select></label><label>Nomor Invoice<input name="invoice_number" required></label><div class="grid grid-2"><label>Tanggal Invoice<input type="date" name="invoice_date"></label><label>Jatuh Tempo<input type="date" name="due_date"></label></div><button class="btn primary">Simpan Invoice</button></form>{% endblock %}
