{% extends "base.html" %}

{% block content %}

<h1>Edit User</h1>

{% if messages %}
    {% for message in messages %}
        <div class="message">
            {{ message }}
        </div>
    {% endfor %}
{% endif %}

<form method="POST">

    {% csrf_token %}

    <div>
        <label>Username</label>

        <input
            type="text"
            value="{{ user.username }}"
            disabled
        >
    </div>

    <div>
        <label>Nama</label>

        <input
            type="text"
            name="name"
            value="{{ user.name }}"
            required
        >
    </div>

    <div>
        <label>Email</label>

        <input
            type="email"
            name="email"
            value="{{ user.email }}"
            required
        >
    </div>

    <div>
        <label>Role</label>

        <select name="role" required>

            {% for role in roles %}

                <option
                    value="{{ role }}"
                    {% if user.role == role %}
                        selected
                    {% endif %}
                >
                    {{ role }}
                </option>

            {% endfor %}

        </select>
    </div>

    <button type="submit">
        Simpan Perubahan
    </button>

</form>

<p>
    <a href="{% url 'user_detail' user_id=user.id %}">
        Kembali
    </a>
</p>

{% endblock %}
