{% extends "base.html" %}

{% block content %}

<h1>Ubah Password</h1>

{% if messages %}
    {% for message in messages %}
        <div class="message">
            {{ message }}
        </div>
    {% endfor %}
{% endif %}

<form method="POST">

    {% csrf_token %}

    <div>
        <label for="current_password">
            Password Lama
        </label>

        <input
            type="password"
            id="current_password"
            name="current_password"
            required
        >
    </div>

    <div>
        <label for="new_password">
            Password Baru
        </label>

        <input
            type="password"
            id="new_password"
            name="new_password"
            required
        >
    </div>

    <div>
        <label for="confirm_password">
            Konfirmasi Password Baru
        </label>

        <input
            type="password"
            id="confirm_password"
            name="confirm_password"
            required
        >
    </div>

    <button type="submit">
        Ubah Password
    </button>

</form>

<p>
    <a href="{% url 'profile' %}">
        Kembali ke Profil
    </a>
</p>

{% endblock %}
