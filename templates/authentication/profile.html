{% extends "base.html" %}

{% block content %}

<h1>Profil Saya</h1>

<div>
    <p>
        <strong>Nama:</strong>
        {{ user.name }}
    </p>

    <p>
        <strong>Username:</strong>
        {{ user.username }}
    </p>

    <p>
        <strong>Email:</strong>
        {{ user.email }}
    </p>

    <p>
        <strong>Role:</strong>
        {{ user.role }}
    </p>

    <p>
        <strong>Status:</strong>
        {{ user.status }}
    </p>
</div>

<p>
    <a href="{% url 'password_change' %}">
        Ubah Password
    </a>
</p>

<p>
    <a href="{% url 'dashboard' %}">
        Kembali ke Dashboard
    </a>
</p>

{% endblock %}
